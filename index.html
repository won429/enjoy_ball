    <script>

            authDomain: "kbo-app-98418.firebaseapp.com",

            storageBucket: "kbo-app-98418.firebasestorage.app",

        const todayStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

        function showToast(msg) {
            let toast = document.getElementById('toast-msg');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast-msg';
                toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-point text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-2xl z-[100] transition-all duration-300 opacity-0 transform -translate-y-4';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            void toast.offsetWidth; 
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => { 
                toast.classList.remove('opacity-100', 'translate-y-0'); 
                toast.classList.add('opacity-0', '-translate-y-4'); 
            }, 2500);
        }

        async function syncWithFirestore() {
            try {
                const matchesSnap = await db.collection("matches").get();
                if (!matchesSnap.empty) {
                    scheduleData = matchesSnap.docs.map(doc => doc.data());
                    scheduleData.sort((a, b) => {
                        if (a.date === b.date) return (a.time || "00:00").localeCompare(b.time || "00:00");
                        return a.date.localeCompare(b.date);
                    });
                }

                db.collection("lineups").onSnapshot((snapshot) => {
                    snapshot.forEach(doc => {
                        liveDataStore[doc.id] = doc.data(); 
                    });
                    if (isSettingsUnlocked) renderSettings();
                });
            } catch (error) {
                console.error("통신 에러:", error);
                showToast("데이터를 불러오지 못했습니다.");
            }
        }

                        <button onclick="checkAdminPwd()" class="bg-point hover:bg-blue-600 text-white font-bold py-3.5 px-8 rounded-xl shadow-md transition-all active:scale-95 w-full mt-2">인증하기</button>

                    <div class="flex flex-col gap-4">
            `;

                            <div class="flex justify-between items-center mb-3">

                            </div>
                            
                            <div class="flex flex-col gap-2 mb-4 bg-black/20 p-3 rounded-xl border border-white/5">
                                <div class="flex justify-end mb-1">

                                        <i class="fa-solid fa-camera-retro"></i> AI 캡처 자동입력
                                    </button>
                                </div>
                                <div class="flex flex-col gap-1.5">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-12 shrink-0 text-center">AWAY 투수</span>
                                        <input type="text" id="away-pitcher-${match.id}" value="${live.awayPitcher || ''}" placeholder="${match.team1} 투수" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-12 shrink-0 text-center">HOME 투수</span>
                                        <input type="text" id="home-pitcher-${match.id}" value="${live.homePitcher || ''}" placeholder="${match.team2} 투수" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">

                                </div>
                                <div class="flex flex-col gap-1.5 mt-1 border-t border-white/5 pt-2">

                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-12 shrink-0 text-center">HOME 타자</span>
                                        <input type="text" id="home-lineup-${match.id}" value="${(live.homeLineup || []).join(', ')}" placeholder="${match.team2} 선발 라인업 (쉼표로 구분)" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">

                            </div>

                            <div class="flex justify-between items-center gap-2">

                                    <option value="경기전" ${live.gameStatus === '경기전' ? 'selected' : ''} class="text-black">경기전</option>
                                    <option value="경기중" ${live.gameStatus === '경기중' ? 'selected' : ''} class="text-black">경기중</option>
                                    <option value="종료" ${live.gameStatus === '종료' ? 'selected' : ''} class="text-black">종료</option>
                                    <option value="우취" ${live.gameStatus === '우취' ? 'selected' : ''} class="text-black">우취</option>
                                </select>
                                <button onclick="document.getElementById('status-${match.id}').value='우취'; saveMatchData(${match.id});" class="h-10 bg-sky-900/60 hover:bg-sky-800 text-sky-300 font-bold px-3 rounded-lg text-[11px] shadow-md active:scale-95 transition-all shrink-0 border border-sky-500/30">
                                    우취
                                </button>
                                <button onclick="saveMatchData(${match.id})" class="h-10 bg-point hover:bg-blue-600 text-white font-bold px-5 rounded-lg text-sm shadow-md active:scale-95 transition-all shrink-0">

            html += `</div>
                </div>

                    <h2 class="text-sm font-bold text-white mb-4"><i class="fa-solid fa-screwdriver-wrench text-gray-400 mr-2"></i>시스템 제어 도구</h2>
                    <button onclick="recalculateRankings()" class="w-full bg-[#2C2C2E] hover:bg-[#3C3C3E] border border-white/10 text-gray-200 font-bold py-3.5 rounded-2xl active:scale-95 transition-all shadow flex items-center justify-center gap-2 mb-3">

                    </button>
                    <button onclick="forceUploadSchedule()" class="w-full bg-[#2C2C2E] hover:bg-[#3C3C3E] border border-white/10 text-point font-bold py-3.5 rounded-2xl active:scale-95 transition-all shadow flex items-center justify-center gap-2 mb-4">

                    </button>
                    
                    <div class="flex gap-3">
                        <button onclick="backupData()" class="flex-1 bg-green-900/40 hover:bg-green-800/60 border border-green-500/30 text-green-400 font-bold py-3 rounded-2xl active:scale-95 transition-all shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-shield-halved"></i> DB 백업
                        </button>
                        <button onclick="restoreData()" class="flex-1 bg-red-900/40 hover:bg-red-800/60 border border-red-500/30 text-red-400 font-bold py-3 rounded-2xl active:scale-95 transition-all shadow flex items-center justify-center gap-2">

                    </div>
                    <p class="text-[10px] text-gray-500 text-center mt-4">백업 데이터를 복구하면 이전 상태로 되돌립니다.</p>

            container.innerHTML = html;

        function checkAdminPwd() {
            const pwd = document.getElementById('admin-pwd').value;
            if (pwd === '3611') {
                isSettingsUnlocked = true;
                renderSettings();
                showToast('관리자 모드가 활성화되었습니다.');
            } else {
                showToast('비밀번호가 일치하지 않습니다.');
            }
        }

        async function processLineupImage(event, matchId, team1, team2) {
            const file = event.target.files[0];
            if (!file) return;

            showToast('AI가 라인업 이미지를 분석 중입니다... ⚾️');

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64String = reader.result.split(',')[1];
                const mimeType = file.type;
                const apiKey = ""; // 런타임 환경에서 자동 제공됨
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                const promptText = `이 KBO 야구 라인업 이미지에서 AWAY팀(${team1})과 HOME팀(${team2})의 선발투수와 선발타자 1~9번 라인업을 추출해줘.
반드시 아래 JSON 구조로만 반환해 (마크다운 백틱은 사용 금지):
{
  "awayPitcher": "${team1} 투수 이름",
  "homePitcher": "${team2} 투수 이름",
  "awayLineup": "${team1} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9",
  "homeLineup": "${team2} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9"
}`;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: mimeType, data: base64String } }] }],
                    generationConfig: { responseMimeType: "application/json" }
                };

                const fetchWithBackoff = async () => {
                    const delays = [1000, 2000, 4000, 8000, 16000];
                    for (let i = 0; i < 5; i++) {
                        try {
                            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                            if (res.ok) return await res.json();
                        } catch (err) {
                            if (i === 4) throw err;
                        }
                        await new Promise(r => setTimeout(r, delays[i]));
                    }
                    throw new Error("All retries failed");
                };

                try {
                    const result = await fetchWithBackoff();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if(text) {
                        const data = JSON.parse(text);
                        if(data.awayPitcher) document.getElementById(`away-pitcher-${matchId}`).value = data.awayPitcher;
                        if(data.homePitcher) document.getElementById(`home-pitcher-${matchId}`).value = data.homePitcher;
                        if(data.awayLineup) document.getElementById(`away-lineup-${matchId}`).value = data.awayLineup;
                        if(data.homeLineup) document.getElementById(`home-lineup-${matchId}`).value = data.homeLineup;
                        showToast('AI 스캔 완료! 라인업이 자동 입력되었습니다.');
                    } else {
                        showToast('AI 분석에 실패했습니다. 이미지를 다시 확인해주세요.');
                    }
                } catch (e) {
                    showToast('AI 서버 통신 중 일시적인 오류가 발생했습니다.');
                }
                event.target.value = ''; // 입력 초기화
            };
            reader.readAsDataURL(file);
        }

        async function saveMatchData(matchId) {
            const status = document.getElementById(`status-${matchId}`).value;
            const inning = document.getElementById(`inning-${matchId}`).value;
            const awayScore = parseInt(document.getElementById(`away-score-${matchId}`).value) || 0;
            const homeScore = parseInt(document.getElementById(`home-score-${matchId}`).value) || 0;

            const awayPitcher = document.getElementById(`away-pitcher-${matchId}`).value.trim();
            const homePitcher = document.getElementById(`home-pitcher-${matchId}`).value.trim();
            const awayLineupStr = document.getElementById(`away-lineup-${matchId}`).value;
            const homeLineupStr = document.getElementById(`home-lineup-${matchId}`).value;

            const awayLineup = awayLineupStr ? awayLineupStr.split(',').map(s => s.trim()).filter(s => s !== '') : [];
            const homeLineup = homeLineupStr ? homeLineupStr.split(',').map(s => s.trim()).filter(s => s !== '') : [];

            try {
                await db.collection("lineups").doc(matchId.toString()).set({
                    gameStatus: status,
                    inning: inning,
                    awayScore: awayScore,
                    homeScore: homeScore,
                    awayPitcher: awayPitcher,
                    homePitcher: homePitcher,
                    awayLineup: awayLineup,
                    homeLineup: homeLineup
                }, { merge: true });

                showToast('성공적으로 서버에 저장되었습니다.');

                if (status === '종료') {
                    await recalculateRankings();
                }
            } catch(e) {
                console.error("데이터 저장 에러:", e);
                showToast('저장 중 통신 오류가 발생했습니다.');
            }
        }

        async function recalculateRankings() {
            showToast('전체 순위를 재계산 중입니다...');
            let teamStats = {};
            const allTeams = ['KIA', '삼성', 'LG', '두산', 'KT', 'SSG', '롯데', '한화', 'NC', '키움'];
            
            allTeams.forEach(t => { teamStats[t] = { team: t, w: 0, d: 0, l: 0, winRate: 0, gb: 0 }; });

            scheduleData.forEach(match => {
                const live = liveDataStore[match.id];
                if (live && live.gameStatus === '종료') {
                    const awayTeam = match.team1;
                    const homeTeam = match.team2;
                    const awayScore = parseInt(live.awayScore) || 0;
                    const homeScore = parseInt(live.homeScore) || 0;

                    if (awayScore > homeScore) {
                        if (teamStats[awayTeam]) teamStats[awayTeam].w++;
                        if (teamStats[homeTeam]) teamStats[homeTeam].l++;
                    } else if (homeScore > awayScore) {
                        if (teamStats[homeTeam]) teamStats[homeTeam].w++;
                        if (teamStats[awayTeam]) teamStats[awayTeam].l++;
                    } else {
                        if (teamStats[awayTeam]) teamStats[awayTeam].d++;
                        if (teamStats[homeTeam]) teamStats[homeTeam].d++;
                    }
                }
            });

            let statsArray = Object.values(teamStats);
            statsArray.forEach(t => {
                const total = t.w + t.l;
                t.winRate = total === 0 ? '-' : (t.w / total).toFixed(3);
                t._calcWinRate = total === 0 ? -1 : (t.w / total);
            });

            statsArray.sort((a, b) => {
                if (b._calcWinRate !== a._calcWinRate) return b._calcWinRate - a._calcWinRate;
                if (b.w !== a.w) return b.w - a.w;
                return 0; 
            });

            if (statsArray.length > 0) {
                const firstTeam = statsArray[0];
                statsArray.forEach((t, i) => {
                    if (i === 0 || firstTeam._calcWinRate === -1) {
                        t.gb = '-';
                    } else {
                        const gb = ((firstTeam.w - t.w) + (t.l - firstTeam.l)) / 2;
                        t.gb = gb === 0 ? '-' : gb.toString();
                    }

                    if (i > 0) {
                        const prev = statsArray[i-1];
                        if (t._calcWinRate === prev._calcWinRate && t.w === prev.w) {
                            t.rank = prev.rank;
                        } else {
                            t.rank = (i + 1).toString();
                        }
                    } else {
                        t.rank = t._calcWinRate === -1 ? '-' : '1';
                    }
                });
            }

            try {
                const batch = db.batch();
                statsArray.forEach(t => {
                    const dataToSave = { ...t };
                    delete dataToSave._calcWinRate; 
                    const docRef = db.collection("rankings").doc(t.team);
                    batch.set(docRef, dataToSave);
                });
                await batch.commit();
                showToast('서버 순위가 완벽하게 동기화되었습니다!');
            } catch(error) {
                console.error("순위 업데이트 실패:", error);
                showToast('순위 반영 중 오류가 발생했습니다.');
            }
        }

        async function forceUploadSchedule() {
            showToast('일정 데이터를 서버로 강제 업로드 중입니다...');
            try {
                const batch = db.batch();
                initialScheduleData.forEach(match => {
                    batch.set(db.collection("matches").doc(match.id.toString()), match);
                });
                await batch.commit();
                
                showToast('모든 일정이 서버에 등록되었습니다!');
                syncWithFirestore();
            } catch (e) {
                console.error("일정 업로드 에러:", e);
                showToast('업로드 중 오류가 발생했습니다.');
            }
        }

        async function backupData() {
            showToast('데이터 백업 중...');
            try {
                const lineupsSnap = await db.collection("lineups").get();
                const rankingsSnap = await db.collection("rankings").get();
                const batch = db.batch();

                lineupsSnap.forEach(doc => { batch.set(db.collection("backup_lineups").doc(doc.id), doc.data()); });
                rankingsSnap.forEach(doc => { batch.set(db.collection("backup_rankings").doc(doc.id), doc.data()); });

                await batch.commit();
                showToast('백업이 완료되었습니다.');
            } catch (e) {
                console.error("백업 에러:", e);
                showToast('백업 중 오류가 발생했습니다.');
            }
        }

        async function restoreData() {
            showToast('데이터 복구 중...');
            try {
                const bLineupsSnap = await db.collection("backup_lineups").get();
                const bRankingsSnap = await db.collection("backup_rankings").get();

                if (bLineupsSnap.empty && bRankingsSnap.empty) {
                    showToast('복구할 백업 데이터가 없습니다.');
                    return;
                }

                const batch = db.batch();

                bLineupsSnap.forEach(doc => { batch.set(db.collection("lineups").doc(doc.id), doc.data()); });
                bRankingsSnap.forEach(doc => { batch.set(db.collection("rankings").doc(doc.id), doc.data()); });

                await batch.commit();
                showToast('데이터가 백업 시점으로 복구되었습니다.');
            } catch (e) {
                console.error("복구 에러:", e);
                showToast('복구 중 오류가 발생했습니다.');
            }
        }

        window.onload = () => {
            syncWithFirestore();
            renderSettings();
        };
    </script>
</body>
</html>
