<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KBO Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 🔥 파이어베이스 SDK (Firebase v10 Compat) 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <!-- 🔥 파이어베이스 Auth(인증) SDK 추가 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>

    <style>
        @font-face {
            font-family: 'KBO-Dia-Gothic';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KBO-Dia-Gothic_medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'KBO-Dia-Gothic';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KBO-Dia-Gothic_bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
        }

        :root { --point-color: #3182F6; }
        body { 
            font-family: 'KBO-Dia-Gothic', sans-serif;
            background-color: #050505; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-point { background-color: var(--point-color) !important; transition: background-color 0.5s ease; }
        .text-point { color: var(--point-color) !important; transition: color 0.5s ease; }
    </style>
</head>
<body class="w-full min-h-[100dvh] flex justify-center items-start overflow-y-auto pb-20">

    <div id="mobile-wrapper" class="w-full h-full max-w-[500px] relative flex flex-col pt-8 px-5">
        
        <!-- 🔥 추가된 로딩 화면 (전체 화면 덮도록 수정) 🔥 -->
        <div id="initial-loader" class="fixed inset-0 z-[9999] hidden flex-col items-center justify-center bg-[#050505] transition-opacity duration-500">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-point mb-4 opacity-80"></i>
            <span class="text-sm font-bold text-white tracking-widest animate-pulse">데이터를 불러오는 중...</span>
        </div>

        <div class="flex items-center justify-center gap-2 mb-8 mt-4 relative">
            <i class="fa-solid fa-server text-point text-2xl"></i>
            <h1 class="text-2xl font-black text-white tracking-tight">KBO 관리자 대시보드</h1>
            <!-- 🔥 로그아웃 버튼 추가 🔥 -->
            <button onclick="logoutAdmin()" id="logout-btn" class="hidden absolute right-0 bg-[#2C2C2E] hover:bg-[#3C3C3E] text-[10px] font-bold px-2.5 py-1.5 rounded shadow active:scale-95 transition-all text-gray-300">로그아웃</button>
        </div>
        
        <div id="settings-container" class="w-full flex-1 flex flex-col gap-4"></div>

        <!-- 🔥 브라우저 차단 방지용 자체 커스텀 API 키 입력 모달 🔥 -->
        <div id="api-key-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm px-5">
            <div class="bg-[#1C1C1E] border border-white/10 rounded-3xl p-6 w-full max-w-[400px] shadow-2xl flex flex-col gap-4 transform transition-all">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-key text-point mr-2"></i>Gemini API 키 설정</h3>
                <p class="text-[12px] text-gray-400 leading-relaxed">AI 캡처 자동입력 기능을 사용하려면 Google Gemini API 키가 필요합니다.<br>최초 1회만 입력하면 기기에 안전하게 저장됩니다.</p>
                <input type="text" id="api-key-input" placeholder="여기에 API 키를 붙여넣으세요" class="bg-black/50 text-white border border-white/20 rounded-xl p-3.5 text-sm focus:outline-none focus:border-point w-full tracking-wider font-mono">
                <div class="flex gap-2 mt-2">
                    <button onclick="closeApiKeyModal()" class="flex-1 bg-[#2C2C2E] hover:bg-[#3C3C3E] text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">취소</button>
                    <button onclick="saveApiKeyAndContinue()" class="flex-1 bg-point hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">저장 및 계속</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 🔥 새로운 파이어베이스 (Firebase) 초기화 및 연결 🔥 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCQt6_wZA5oXTDVBlK0R6Rm2EXMfzCsOx0",
            authDomain: "enjoykbooo.firebaseapp.com",
            projectId: "enjoykbooo",
            storageBucket: "enjoykbooo.firebasestorage.app",
            messagingSenderId: "878790224198",
            appId: "1:878790224198:web:56a3b91d2538e11627dd47"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // 🔥 추가: 외부 접속 환경(보안 네트워크 등)에서 발생하는 Firestore 무한 대기/타임아웃 에러 우회 🔥
        db.settings({ experimentalForceLongPolling: true, useFetchStreams: false });
        
        const auth = firebase.auth(); // 🔥 인증 모듈 초기화

        let scheduleData = [];
        let liveDataStore = {}; 
        let isSettingsUnlocked = false; 
        let pendingAiTask = null; 
        let isSaving = false; 
        
        // 새 구조 폴링 제어용
        let livePollingInterval = null;
        let scheduleMonthCache = new Set();
        
        const initialScheduleData = []; 

        let currentDate = new Date();
        const todayStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

        function showToast(msg) {
            let toast = document.getElementById('toast-msg');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast-msg';
                toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-point text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-2xl z-[100] transition-all duration-300 opacity-0 transform -translate-y-4';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            void toast.offsetWidth; 
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => { 
                toast.classList.remove('opacity-100', 'translate-y-0'); 
                toast.classList.add('opacity-0', '-translate-y-4'); 
            }, 3500); 
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[char]);
        }

        function liveRunnerName(live, base) {
            const raw = live[`base${base}Runner`] || live[`base${base}RunnerName`] || live[`runner${base}`] || '';
            return raw && typeof raw === 'object' ? (raw.name || raw.playerName || '') : raw;
        }

        function liveBatterSide(live, side) {
            const raw = live[`${side}CurrentBatterSide`] || live[`${side}BatterSide`] || '';
            const value = String(raw).toUpperCase();
            if (value.includes('좌') || value === 'L' || value.includes('LEFT')) return '좌타';
            if (value.includes('우') || value === 'R' || value.includes('RIGHT')) return '우타';
            return '';
        }

        function normalizeSubstitution(raw) {
            if (!raw || typeof raw !== 'object') return {};
            return {
                outName: raw.outName || raw.out || raw.replacedPlayer || raw.previousPlayer || '',
                inName: raw.inName || raw.in || raw.player || raw.name || raw.newPlayer || '',
                role: raw.role || raw.type || raw.reason || '교체',
                position: raw.position || raw.pos || '',
                order: raw.order ?? raw.battingOrder ?? raw.batOrder ?? ''
            };
        }

        function substitutionRowHtml(matchId, side, raw = {}) {
            const item = normalizeSubstitution(raw);
            const roles = ['교체', '대타', '대주자', '수비교체', '투수교체'];
            const roleOptions = roles.map(role =>
                `<option value="${role}" ${item.role === role ? 'selected' : ''} class="text-black">${role}</option>`
            ).join('');

            return `
                <div class="substitution-row rounded-lg border border-white/10 bg-black/25 p-2 space-y-1.5">
                    <div class="grid grid-cols-[minmax(0,1fr)_18px_minmax(0,1fr)] items-center gap-1.5">
                        <input type="text" data-field="outName" value="${escapeHtml(item.outName)}" placeholder="기존 선수" class="min-w-0 bg-white/10 text-white text-[10px] rounded border border-white/15 p-1.5 focus:border-emerald-400 outline-none">
                        <i class="fa-solid fa-arrow-right text-center text-[9px] text-emerald-400"></i>
                        <input type="text" data-field="inName" value="${escapeHtml(item.inName)}" placeholder="교체 선수" class="min-w-0 bg-emerald-900/20 text-white text-[10px] rounded border border-emerald-500/30 p-1.5 focus:border-emerald-400 outline-none">
                    </div>
                    <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_48px_28px] items-center gap-1.5">
                        <select data-field="role" class="min-w-0 bg-white/10 text-white text-[10px] rounded border border-white/15 p-1.5 focus:border-emerald-400 outline-none">${roleOptions}</select>
                        <select data-field="position" title="교체 후 수비 위치" class="min-w-0 bg-white/10 text-white text-[10px] rounded border border-white/15 p-1.5 focus:border-emerald-400 outline-none">${defensePositionOptions(item.position)}</select>
                        <input type="number" data-field="order" value="${escapeHtml(item.order)}" min="1" max="9" placeholder="타순" title="타순" class="w-full bg-white/10 text-white text-[10px] rounded border border-white/15 p-1.5 text-center focus:border-emerald-400 outline-none">
                        <button type="button" onclick="removeSubstitutionRow(this)" title="교체 선수 삭제" class="h-7 rounded bg-red-500/10 text-red-400 hover:bg-red-500/20 active:scale-95 transition-all"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
        }

        function substitutionRowsHtml(matchId, side, items) {
            return (Array.isArray(items) ? items : []).map(item => substitutionRowHtml(matchId, side, item)).join('');
        }

        function addSubstitutionRow(matchId, side) {
            const container = document.getElementById(`sub-list-${side}-${matchId}`);
            if (container) container.insertAdjacentHTML('beforeend', substitutionRowHtml(matchId, side));
        }

        function removeSubstitutionRow(button) {
            const row = button.closest('.substitution-row');
            if (row) row.remove();
        }

        function collectSubstitutions(matchId, side) {
            const container = document.getElementById(`sub-list-${side}-${matchId}`);
            if (!container) return [];

            return Array.from(container.querySelectorAll('.substitution-row')).map(row => {
                const read = field => (row.querySelector(`[data-field="${field}"]`)?.value || '').trim();
                const orderValue = parseInt(read('order'), 10);
                const item = {
                    outName: read('outName'),
                    inName: read('inName'),
                    role: read('role') || '교체',
                    position: read('position')
                };
                if (Number.isInteger(orderValue) && orderValue >= 1 && orderValue <= 9) item.order = orderValue;
                return item;
            }).filter(item => item.inName);
        }

        const DEFENSE_POSITIONS = ['포수', '1루수', '2루수', '3루수', '유격수', '좌익수', '중견수', '우익수', '지명타자', '투수'];

        function lineupPlayerName(raw) {
            if (raw && typeof raw === 'object') return raw.name || raw.playerName || '';
            return String(raw || '').trim();
        }

        function lineupNamesFromRaw(raw) {
            if (Array.isArray(raw)) return raw.map(lineupPlayerName).filter(Boolean).slice(0, 9);
            return String(raw || '').split(',').map(name => name.trim()).filter(Boolean).slice(0, 9);
        }

        function liveLineupNames(live, side) {
            const basic = lineupNamesFromRaw(live[`${side}Lineup`]);
            if (basic.length) return basic;
            return lineupNamesFromRaw(live[`${side}LineupDetail`]);
        }

        function lineupPositionOf(live, side, index, name) {
            const detail = Array.isArray(live[`${side}LineupDetail`]) ? live[`${side}LineupDetail`] : [];
            const basic = Array.isArray(live[`${side}Lineup`]) ? live[`${side}Lineup`] : [];
            const byName = detail.find(player => lineupPlayerName(player) === name);
            const player = byName || detail[index] || basic[index] || {};
            return player && typeof player === 'object' ? (player.position || player.pos || '') : '';
        }

        function defensePositionOptions(selected = '') {
            return `<option value="" class="text-black">미정</option>` + DEFENSE_POSITIONS.map(position =>
                `<option value="${position}" ${selected === position ? 'selected' : ''} class="text-black">${position}</option>`
            ).join('');
        }

        function lineupPositionEditorHtml(matchId, side, team, live) {
            const names = liveLineupNames(live, side);
            const rows = Array.from({ length: 9 }, (_, index) => {
                const name = names[index] || '';
                const position = lineupPositionOf(live, side, index, name);
                return `<label class="grid grid-cols-[minmax(0,1fr)_74px] items-center gap-1 rounded-md bg-black/25 px-1.5 py-1 border border-white/5">
                    <span id="${side}-lineup-name-${matchId}-${index}" class="min-w-0 truncate text-[9px] font-bold ${name ? 'text-gray-200' : 'text-gray-600'}">${index + 1}. ${escapeHtml(name || '선수 미입력')}</span>
                    <select id="${side}-lineup-position-${matchId}-${index}" title="${index + 1}번 타자 수비 위치" class="min-w-0 bg-white/10 text-white text-[9px] rounded border border-white/15 px-1 py-1 focus:border-point outline-none">${defensePositionOptions(position)}</select>
                </label>`;
            }).join('');
            return `<section class="min-w-0 rounded-lg border border-blue-500/20 bg-blue-950/20 p-1.5">
                <div class="mb-1.5 flex items-center justify-between gap-1">
                    <span class="truncate text-[10px] font-bold text-blue-300">${escapeHtml(team)} 수비 위치</span>
                    <span class="shrink-0 text-[8px] text-gray-500">타순 기준</span>
                </div>
                <div class="space-y-1">${rows}</div>
            </section>`;
        }

        function syncLineupPositionLabels(matchId, side) {
            const input = document.getElementById(`${side}-lineup-${matchId}`);
            const names = lineupNamesFromRaw(input?.value || '');
            for (let index = 0; index < 9; index++) {
                const label = document.getElementById(`${side}-lineup-name-${matchId}-${index}`);
                if (!label) continue;
                const name = names[index] || '';
                label.textContent = `${index + 1}. ${name || '선수 미입력'}`;
                label.classList.toggle('text-gray-200', Boolean(name));
                label.classList.toggle('text-gray-600', !name);
            }
        }

        function applyLineupToForm(matchId, side, rawLineup, rawDetail = null) {
            const input = document.getElementById(`${side}-lineup-${matchId}`);
            if (!input) return;
            const names = lineupNamesFromRaw(rawLineup);
            input.value = names.join(', ');
            const detail = Array.isArray(rawDetail) ? rawDetail : (Array.isArray(rawLineup) ? rawLineup : []);
            names.forEach((name, index) => {
                const player = detail.find(item => lineupPlayerName(item) === name) || detail[index] || {};
                const select = document.getElementById(`${side}-lineup-position-${matchId}-${index}`);
                if (select && player && typeof player === 'object') select.value = player.position || player.pos || '';
            });
            syncLineupPositionLabels(matchId, side);
        }

        function collectLineupDetail(matchId, side, names, existingDetail = []) {
            const oldPlayers = Array.isArray(existingDetail) ? existingDetail : [];
            return names.map((name, index) => {
                const oldPlayer = oldPlayers.find(player => lineupPlayerName(player) === name) || oldPlayers[index] || {};
                const select = document.getElementById(`${side}-lineup-position-${matchId}-${index}`);
                return {
                    ...(oldPlayer && typeof oldPlayer === 'object' ? oldPlayer : {}),
                    name,
                    position: select?.value || '',
                    battingOrder: index + 1
                };
            });
        }

        // 🔥 로그인 상태 감지 리스너 🔥
        auth.onAuthStateChanged(user => {
            if (user) {
                isSettingsUnlocked = true;
                const logoutBtn = document.getElementById('logout-btn');
                if(logoutBtn) logoutBtn.classList.remove('hidden');
                syncWithFirestore(); // 로그인 성공 시에만 데이터 불러오기
            } else {
                isSettingsUnlocked = false;
                const logoutBtn = document.getElementById('logout-btn');
                if(logoutBtn) logoutBtn.classList.add('hidden');
                renderSettings(); // 로그인 전이면 로그인 화면 렌더링
            }
        });

        // 🔥 관리자 로그인 함수 🔥
        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const pwd = document.getElementById('admin-pwd').value;
            try {
                await auth.signInWithEmailAndPassword(email, pwd);
                showToast('로그인 성공! 대시보드를 불러옵니다.');
            } catch (e) {
                showToast('이메일이나 비밀번호가 일치하지 않습니다.');
            }
        }

        // 🔥 관리자 로그아웃 함수 🔥
        async function logoutAdmin() {
            try {
                await auth.signOut();
                scheduleData = [];
                liveDataStore = {};
                if (livePollingInterval) clearInterval(livePollingInterval);
                showToast('안전하게 로그아웃 되었습니다.');
            } catch (e) {
                showToast('로그아웃 중 오류가 발생했습니다.');
            }
        }

        // 🔥 지정된 달의 일정을 서버에서 가져옴 🔥
        async function fetchScheduleForMonth(year, month) {
            const yyyyMm = `${year}-${String(month).padStart(2, '0')}`;
            if (scheduleMonthCache.has(yyyyMm)) return;
            try {
                const snap = await db.collection("schedule").doc(yyyyMm).get();
                if (snap.exists) {
                    const data = snap.data().games || [];
                    data.forEach(g => {
                        g.team1 = g.awayTeam || g.team1;
                        g.team2 = g.homeTeam || g.team2;
                        g.time = g.gameTime || g.time;
                        let existing = scheduleData.find(x => x.id === g.id);
                        if (!existing) scheduleData.push(g);
                        else Object.assign(existing, g);
                    });
                    scheduleData.sort((a, b) => {
                        if (a.date === b.date) return (a.time || "00:00").localeCompare(b.time || "00:00");
                        return a.date.localeCompare(b.date);
                    });
                }
                scheduleMonthCache.add(yyyyMm);
            } catch (e) { console.error("일정 불러오기 에러:", e); }
        }

        // 🔥 초기 동기화 (새로운 getDoc 구조) 🔥
        async function syncWithFirestore() {
            const loader = document.getElementById('initial-loader');
            if (loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }

            const fallbackTimer = setTimeout(() => {
                if (loader && !loader.classList.contains('hidden')) {
                    loader.classList.add('hidden'); loader.classList.remove('flex');
                    if (isSettingsUnlocked) renderSettings();
                    showToast('네트워크 응답이 느려 강제로 대시보드 화면을 표시합니다.');
                }
            }, 8000);

            try {
                let dateInput = document.getElementById('settings-date-input');
                let initialDate = dateInput ? dateInput.value : todayStr;
                const [yyyy, mm, dd] = initialDate.split('-');

                // 1. 해당 월의 일정 데이터 가져오기
                await fetchScheduleForMonth(yyyy, mm);

                // 2. 화면 강제 렌더링
                if (isSettingsUnlocked) renderSettings();

                // 3. 해당 날짜 경기 데이터 폴링 시작
                await pollDateMatches(initialDate);

            } catch (error) {
                console.error("통신 에러:", error);
                showToast("데이터를 불러오지 못했습니다. 권한을 확인하세요.");
            } finally {
                clearTimeout(fallbackTimer);
                if (loader) { loader.classList.add('hidden'); loader.classList.remove('flex'); }
            }
        }

        // 🔥 특정 날짜의 경기를 가져오는 함수 (polling 적용) 🔥
        async function pollDateMatches(targetDate) {
            // 이전 폴링 정리
            if (livePollingInterval) clearInterval(livePollingInterval);
            
            const fetchMatchData = async () => {
                if (isSaving) return;
                try {
                    let snap;
                    if (targetDate === todayStr) {
                        snap = await db.collection("live").doc("today").get();
                    } else {
                        snap = await db.collection("games").doc(targetDate).get();
                    }
                    
                    if (snap.exists) {
                        const data = snap.data();
                        const games = data.games || [];
                        games.forEach(g => {
                            liveDataStore[g.id] = g;
                        });
                        if (isSettingsUnlocked && !isSaving) renderSettings();
                        
                        // 오늘 경기이고 모든 경기가 끝났다면 폴링 중지
                        if (targetDate === todayStr && data.allDone) {
                            if (livePollingInterval) clearInterval(livePollingInterval);
                        }
                    } else {
                        // 해당 날짜에 데이터가 아예 없는 경우
                        if (isSettingsUnlocked && !isSaving) renderSettings();
                    }
                } catch(e) { console.error("데이터 패치 에러:", e); }
            };

            await fetchMatchData(); // 즉시 1회 실행

            // 타겟 날짜가 오늘일 경우에만 폴링 실행
            if (targetDate === todayStr) {
                livePollingInterval = setInterval(fetchMatchData, 30000); // 30초마다 갱신
            }
        }

        async function handleDateChange() {

                        <button onclick="restoreData()" class="flex-1 bg-red-900/40 hover:bg-red-800/60 border border-red-500/30 text-red-400 font-bold py-3 rounded-2xl active:scale-95 transition-all shadow flex items-center justify-center gap-2">

        // 🔥 수동 초기화 함수 🔥
        function resetApiKey() {
            localStorage.removeItem('kbo_gemini_api_key');
            showToast('기기에 저장된 API 키가 완벽하게 삭제되었습니다. 다음 캡처 시 새 키를 입력하세요!');
        }

        // 🔥 모달 제어 함수들 🔥
        function openApiKeyModal(taskType, payload, matchId, team1, team2) {
            pendingAiTask = { type: taskType, payload: payload, matchId: matchId, team1: team1, team2: team2 };
            document.getElementById('api-key-input').value = '';
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeApiKeyModal() {
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            pendingAiTask = null;
            showToast('API 키 입력이 취소되었습니다.');
        }

        function saveApiKeyAndContinue() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) {
                showToast('API 키를 입력해주세요.');
                return;
            }
            localStorage.setItem('kbo_gemini_api_key', key);
            
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            
            if (pendingAiTask) {
                if (pendingAiTask.type === 'image') {
                    executeAiProcess(pendingAiTask.payload, pendingAiTask.matchId, pendingAiTask.team1, pendingAiTask.team2, key);
                } else if (pendingAiTask.type === 'link') {
                    executeLinkSyncProcess(pendingAiTask.payload, pendingAiTask.matchId, pendingAiTask.team1, pendingAiTask.team2, key);
                }
                pendingAiTask = null;
            }
        }

        // 사진 올릴 때 가장 먼저 실행되는 함수
        async function processLineupImage(event, matchId, team1, team2) {
            const file = event.target.files[0];
            if (!file) return;

            let apiKey = localStorage.getItem('kbo_gemini_api_key');
            
            if (!apiKey) {
                openApiKeyModal('image', file, matchId, team1, team2);
                event.target.value = ''; 
                return;
            }
            
            executeAiProcess(file, matchId, team1, team2, apiKey);
            event.target.value = ''; 
        }

        // 🔥 링크 동기화 버튼 클릭 시 실행되는 함수 🔥
        async function processLinkSync(matchId, team1, team2) {
            const urlInput = document.getElementById(`link-input-${matchId}`).value.trim();
            if (!urlInput) {
                showToast('네이버 스포츠 등 중계 링크를 입력해주세요.');
                return;
            }

            let apiKey = localStorage.getItem('kbo_gemini_api_key');
            if (!apiKey) {
                openApiKeyModal('link', urlInput, matchId, team1, team2);
                return;
            }

            executeLinkSyncProcess(urlInput, matchId, team1, team2, apiKey);
        }

        // 🔥 링크 크롤링 및 실시간 AI 데이터 추출 로직 🔥
        async function executeLinkSyncProcess(urlStr, matchId, team1, team2, apiKey) {
            const btn = document.getElementById(`btn-ai-link-${matchId}`);
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 추출중...`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            showToast('웹페이지에서 실시간 데이터를 읽고 있습니다... 📡');

            try {
                // 브라우저 보안(CORS) 우회를 위해 무료 프록시 서버 사용
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlStr)}`;
                const proxyRes = await fetch(proxyUrl);
                const proxyData = await proxyRes.json();
                
                if (!proxyData.contents) {
                    throw new Error("웹페이지를 읽어올 수 없습니다. 유효한 중계 링크인지 확인해주세요.");
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(proxyData.contents, 'text/html');
                // script 태그를 삭제하지 않고 살려둡니다. 실시간 점수와 라인업 데이터가 그 안에 숨어있기 때문입니다!
                doc.querySelectorAll('style, img, svg, iframe, noscript').forEach(el => el.remove());
                
                const textContent = doc.documentElement.textContent.replace(/\s+/g, ' ').trim().substring(0, 60000); 

                if (textContent.length < 50) {
                    throw new Error("링크 보안 차단으로 내용을 읽을 수 없습니다. 다른 중계 링크 시도해주세요.");
                }

                const promptText = `다음은 KBO 야구 중계 페이지의 추출된 텍스트야. 여기서 ${team1}과(와) ${team2}의 실시간 경기 정보를 정확히 추출해줘.
텍스트 데이터:
${textContent}

반드시 아래 JSON 구조로만 반환해 (마크다운 백틱은 사용 금지, 오직 JSON만 반환).
아직 정보가 없다면 기본값이나 빈 문자열을 넣어줘.
{
  "gameStatus": "경기전, 경기중, 종료, 우취 중 하나",
  "inning": "진행 중인 이닝 (예: 3회초, 5회말. 경기전/종료면 빈문자열)",
  "awayScore": ${team1}의 현재 점수 (숫자만, 없으면 0),
  "homeScore": ${team2}의 현재 점수 (숫자만, 없으면 0),
  "awayPitcher": "${team1} 선발투수 이름",
  "homePitcher": "${team2} 선발투수 이름",
  "awayCurrentBatter": "${team1}의 현재 타자 이름 (공격 중이 아니거나 확인 불가면 빈문자열)",
  "homeCurrentBatter": "${team2}의 현재 타자 이름 (공격 중이 아니거나 확인 불가면 빈문자열)",
  "awayCurrentBatterSide": "${team1} 현재 타자의 좌타 또는 우타 (확인 불가면 빈문자열)",
  "homeCurrentBatterSide": "${team2} 현재 타자의 좌타 또는 우타 (확인 불가면 빈문자열)",
  "awayLineup": "${team1} 선발타자 1번~9번 이름 (쉼표로 구분)",
  "homeLineup": "${team2} 선발타자 1번~9번 이름 (쉼표로 구분)",
  "ball": 현재 볼 카운트 (숫자),
  "strike": 현재 스트라이크 카운트 (숫자),
  "out": 현재 아웃 카운트 (숫자),
  "base1": 1루 주자 여부 (true/false),
  "base2": 2루 주자 여부 (true/false),
  "base3": 3루 주자 여부 (true/false),
  "base1Runner": "1루 주자 이름 (없거나 확인 불가면 빈문자열)",
  "base2Runner": "2루 주자 이름 (없거나 확인 불가면 빈문자열)",
  "base3Runner": "3루 주자 이름 (없거나 확인 불가면 빈문자열)",
  "awayPitcherCount": 원정 투수 투구수 (숫자),
  "homePitcherCount": 홈 투수 투구수 (숫자),
  "awayInning": ["0", "0", "1", "-", "-", "-", "-", "-", "-"],
  "homeInning": ["0", "0", "0", "-", "-", "-", "-", "-", "-"],
  "awayHit": 원정 안타 (숫자),
  "awayError": 원정 에러 (숫자),
  "awayBase": 원정 볼넷 (숫자),
  "homeHit": 홈 안타 (숫자),
  "homeError": 홈 에러 (숫자),
  "homeBase": 홈 볼넷 (숫자),
  "winPitcher": "승리 투수 이름 (종료 시에만, 없으면 빈문자열)",
  "losePitcher": "패전 투수 이름 (종료 시에만, 없으면 빈문자열)"
}`;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
                };

                const fallbackModels = [
                    "gemini-1.5-flash-latest",
                    "gemini-1.5-flash",
                    "gemini-2.5-flash"
                ];

                let result = null;
                let lastErrorMessage = "";

                for (const model of fallbackModels) {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    
                    const fetchWithBackoff = async () => {
                        const delays = [1000, 2000, 4000]; 
                        for (let i = 0; i < 3; i++) {
                            try {
                                const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                if (res.ok) return await res.json();
                                
                                const errText = await res.text();
                                if (res.status === 401 || res.status === 403) {
                                    localStorage.removeItem('kbo_gemini_api_key');
                                    throw new Error(`API 키 오류 또는 권한 없음`);
                                } else if (res.status === 404 || res.status === 400) {
                                    throw new Error("MODEL_NOT_FOUND");
                                } else if (res.status === 429) {
                                    throw new Error("구글 API 무료 할당량 초과");
                                }
                                throw new Error(`구글 서버 오류`);
                            } catch (err) {
                                if (err.name === "TypeError" && err.message.includes("fetch")) throw new Error("통신 차단됨 (광고차단기 등을 꺼주세요)");
                                if (err.message.includes("API 키") || err.message.includes("할당량") || err.message === "MODEL_NOT_FOUND") throw err;
                                if (i === 2) throw err;
                            }
                            await new Promise(r => setTimeout(r, delays[i]));
                        }
                    };

                    try {
                        result = await fetchWithBackoff();
                        break;
                    } catch (err) {
                        if (err.message === "MODEL_NOT_FOUND") {
                            lastErrorMessage = "사용 가능한 모델 버전을 찾을 수 없습니다.";
                            continue;
                        } else {
                            throw err;
                        }
                    }
                }

                if (!result) throw new Error(lastErrorMessage || "AI 통신에 실패했습니다.");

                let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(text);
                    
                    if (data.gameStatus) document.getElementById(`status-${matchId}`).value = data.gameStatus;
                    if (data.inning !== undefined) document.getElementById(`inning-${matchId}`).value = data.inning;
                    if (data.awayScore !== undefined) document.getElementById(`away-score-${matchId}`).value = data.awayScore;
                    if (data.homeScore !== undefined) document.getElementById(`home-score-${matchId}`).value = data.homeScore;
                    
                    if (data.awayPitcher) document.getElementById(`away-pitcher-${matchId}`).value = data.awayPitcher;
                    if (data.homePitcher) document.getElementById(`home-pitcher-${matchId}`).value = data.homePitcher;
                    if (data.awayCurrentBatter !== undefined) document.getElementById(`away-current-batter-${matchId}`).value = data.awayCurrentBatter;
                    if (data.homeCurrentBatter !== undefined) document.getElementById(`home-current-batter-${matchId}`).value = data.homeCurrentBatter;
                    if (data.awayCurrentBatterSide !== undefined) document.getElementById(`away-current-batter-side-${matchId}`).value = data.awayCurrentBatterSide;
                    if (data.homeCurrentBatterSide !== undefined) document.getElementById(`home-current-batter-side-${matchId}`).value = data.homeCurrentBatterSide;
                    if (data.awayLineup || data.awayLineupDetail) applyLineupToForm(matchId, 'away', data.awayLineup || data.awayLineupDetail, data.awayLineupDetail);
                    if (data.homeLineup || data.homeLineupDetail) applyLineupToForm(matchId, 'home', data.homeLineup || data.homeLineupDetail, data.homeLineupDetail);
                    
                    if (data.ball !== undefined) document.getElementById(`ball-${matchId}`).value = data.ball;
                    if (data.strike !== undefined) document.getElementById(`strike-${matchId}`).value = data.strike;
                    if (data.out !== undefined) document.getElementById(`out-${matchId}`).value = data.out;
                    if (data.base1 !== undefined) document.getElementById(`base1-${matchId}`).checked = data.base1;
                    if (data.base2 !== undefined) document.getElementById(`base2-${matchId}`).checked = data.base2;
                    if (data.base3 !== undefined) document.getElementById(`base3-${matchId}`).checked = data.base3;

        // 실질적인 AI 통신 처리 함수
        async function executeAiProcess(file, matchId, team1, team2, apiKey) {
            const btn = document.getElementById(`btn-ai-${matchId}`);
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 분석 진행중...`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            showToast('AI가 라인업 이미지를 분석 중입니다... ⚾️');

            const reader = new FileReader();
            reader.onloadend = async () => {
                try {
                    const base64String = reader.result.split(',')[1];
                    const mimeType = file.type;
                    
                    const promptText = `이 KBO 야구 라인업 이미지에서 AWAY팀(${team1})과 HOME팀(${team2})의 선발투수와 선발타자 1~9번 라인업을 추출해줘.
반드시 아래 JSON 구조로만 반환해 (마크다운 백틱은 사용 금지, 오직 JSON만 반환):
{
  "awayPitcher": "${team1} 투수 이름",
  "homePitcher": "${team2} 투수 이름",
  "awayLineup": "${team1} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9",
  "homeLineup": "${team2} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9"
}`;

                    const payload = {
                        contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: mimeType, data: base64String } }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const fallbackModels = [
                        "gemini-1.5-flash-latest",
                        "gemini-1.5-flash",
                        "gemini-2.5-flash"
                    ];

                    let result = null;
                    let lastErrorMessage = "";

                    for (const model of fallbackModels) {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                        console.log(`[AI] 시도 중인 모델 엔진: ${model}`);

                        const fetchWithBackoff = async () => {
                            const delays = [1000, 2000, 4000]; 
                            for (let i = 0; i < 3; i++) {
                                try {
                                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                    if (res.ok) {
                                        return await res.json();
                                    } else {
                                        const errText = await res.text();
                                        console.error(`API 오류 (상태코드: ${res.status}):`, errText);
                                        
                                        if (res.status === 401 || res.status === 403) {
                                            localStorage.removeItem('kbo_gemini_api_key');
                                            throw new Error(`API 키가 잘못되었거나 권한이 없습니다.`);
                                        } else if (res.status === 404 || res.status === 400) {
                                            throw new Error("MODEL_NOT_FOUND"); 
                                        } else if (res.status === 429) {
                                            throw new Error("구글 API 무료 할당량 초과");
                                        }
                                        throw new Error(`구글 서버 오류 (코드: ${res.status})`);
                                    }
                                } catch (err) {
                                    if (err.name === "TypeError" && err.message.includes("fetch")) {
                                        throw new Error("브라우저 통신 차단 (광고차단기를 끄거나 다른 브라우저를 사용하세요)");
                                    }
                                    if (err.message.includes("API 키가 잘못") || err.message.includes("할당량") || err.message === "MODEL_NOT_FOUND") throw err;
                                    if (i === 2) throw err;
                                }
                                await new Promise(r => setTimeout(r, delays[i]));
                            }
                        };

                        try {
                            result = await fetchWithBackoff();
                            break; 
                        } catch (err) {
                            if (err.message === "MODEL_NOT_FOUND") {
                                console.warn(`[AI] ${model} 버전을 지원하지 않아 다음 버전으로 넘어갑니다.`);
                                lastErrorMessage = "사용 가능한 모델 버전을 찾을 수 없습니다.";
                                continue; 
                            } else {
                                throw err; 
                            }
                        }
                    }

                    if (!result) {
                        throw new Error(lastErrorMessage || "모든 모델 버전 시도에 실패했습니다.");
                    }

                    let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if(text) {
                        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                        const data = JSON.parse(text);
                        
                        if(data.awayPitcher) document.getElementById(`away-pitcher-${matchId}`).value = data.awayPitcher;
                        if(data.homePitcher) document.getElementById(`home-pitcher-${matchId}`).value = data.homePitcher;
                        if(data.awayLineup || data.awayLineupDetail) applyLineupToForm(matchId, 'away', data.awayLineup || data.awayLineupDetail, data.awayLineupDetail);
                        if(data.homeLineup || data.homeLineupDetail) applyLineupToForm(matchId, 'home', data.homeLineup || data.homeLineupDetail, data.homeLineupDetail);
                        
                        showToast('AI 스캔 완료! 라인업이 자동 입력되었습니다.');
                    } else {
                        showToast('AI 분석에 실패했습니다. 이미지를 다시 확인해주세요.');
                    }
                } catch (e) {
                    console.error("AI Error:", e);
                    showToast(`오류 발생: ${e.message}`);
                } finally {
                    btn.innerHTML = originalBtnHtml;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            };
            reader.readAsDataURL(file);
        }

        // 🔥 새 구조 반영: 전체 경기 데이터(games/*)를 순회하며 순위 재계산 후 rankings/current 단일 저장 🔥
        async function recalculateRankings() {
            showToast('전체 순위를 재계산 중입니다...');
            let teamStats = {};
            const allTeams = ['KIA', '삼성', 'LG', '두산', 'KT', 'SSG', '롯데', '한화', 'NC', '키움'];
            
            allTeams.forEach(t => { teamStats[t] = { team: t, w: 0, d: 0, l: 0, winRate: 0, gb: 0 }; });

            try {
                // 종료된 경기 통계를 위해 모든 games 컬렉션을 조회하여 계산
                const gamesSnap = await db.collection("games").get();
                
                gamesSnap.forEach(doc => {
                    const data = doc.data();
                    const games = data.games || [];
                    
                    games.forEach(live => {
                        if (live.gameStatus === '종료') {
                            const awayTeam = live.awayTeam || live.team1;
                            const homeTeam = live.homeTeam || live.team2;
                            const awayScore = parseInt(live.awayScore) || 0;
                            const homeScore = parseInt(live.homeScore) || 0;

                            if (awayScore > homeScore) {
                                if (teamStats[awayTeam]) teamStats[awayTeam].w++;
                                if (teamStats[homeTeam]) teamStats[homeTeam].l++;
                            } else if (homeScore > awayScore) {
                                if (teamStats[homeTeam]) teamStats[homeTeam].w++;
                                if (teamStats[awayTeam]) teamStats[awayTeam].l++;
                            } else {
                                if (teamStats[awayTeam]) teamStats[awayTeam].d++;
                                if (teamStats[homeTeam]) teamStats[homeTeam].d++;
                            }
                        }
                    });
                });

                let statsArray = Object.values(teamStats);
                statsArray.forEach(t => {
                    const total = t.w + t.l;
                    t.winRate = total === 0 ? '-' : (t.w / total).toFixed(3);
                    t._calcWinRate = total === 0 ? -1 : (t.w / total);
                });

                statsArray.sort((a, b) => {
                    if (b._calcWinRate !== a._calcWinRate) return b._calcWinRate - a._calcWinRate;
                    if (b.w !== a.w) return b.w - a.w;
                    return 0; 
                });

                if (statsArray.length > 0) {
                    const firstTeam = statsArray[0];
                    statsArray.forEach((t, i) => {
                        if (i === 0 || firstTeam._calcWinRate === -1) {
                            t.gb = '-';
                        } else {
                            const gb = ((firstTeam.w - t.w) + (t.l - firstTeam.l)) / 2;
                            t.gb = gb === 0 ? '-' : gb.toString();
                        }

                        if (i > 0) {
                            const prev = statsArray[i-1];
                            if (t._calcWinRate === prev._calcWinRate && t.w === prev.w) {
                                t.rank = prev.rank;
                            } else {
                                t.rank = (i + 1).toString();
                            }
                        } else {
                            t.rank = t._calcWinRate === -1 ? '-' : '1';
                        }
                    });
                }

                // rankings/current 단일 문서에 저장
                await db.collection("rankings").doc("current").set({
                    data: statsArray,
                    updatedAt: Date.now()
                });
                
                showToast('서버 순위가 완벽하게 동기화되었습니다!');
            } catch(error) {
                console.error("순위 업데이트 실패:", error);
                showToast('순위 반영 중 오류가 발생했습니다.');
            }
        }

        // 🔥 새 구조 반영: 일정 데이터를 월별(YYYY-MM)로 분할하여 schedule 컬렉션에 저장 🔥
        async function forceUploadSchedule() {

            try {
                let groupedByMonth = {};

                initialScheduleData.forEach(m => {
                    const [yyyy, mm] = m.date.split('-');
                    const yyyyMm = `${yyyy}-${mm}`;
                    
                    if (!groupedByMonth[yyyyMm]) {
                        groupedByMonth[yyyyMm] = [];
                    }
                    
                    // 새 구조에 맞춘 기본 포맷팅 적용
                    const newMatchObj = {
                        id: m.id, date: m.date, time: m.time, stadium: m.stadium, 
                        team1: m.team1, team2: m.team2, awayTeam: m.team1, homeTeam: m.team2, gameTime: m.time
                    };
                    
                    groupedByMonth[yyyyMm].push(newMatchObj);
                });

                const batch = db.batch();
                Object.keys(groupedByMonth).forEach(monthKey => {
                    batch.set(db.collection("schedule").doc(monthKey), { games: groupedByMonth[monthKey] });
                });

                await batch.commit();
                
                showToast('모든 일정이 서버에 등록되었습니다!');
                syncWithFirestore();
            } catch (e) {
                console.error("일정 업로드 에러:", e);
                showToast('업로드 중 오류가 발생했습니다.');
            }
        }

        async function backupData() {
            showToast('데이터 백업은 새 구조에서 일시적으로 제한됩니다 (읽기 쿼터 절약 목적).');
        }

        async function restoreData() {
            showToast('데이터 복구는 새 구조에서 일시적으로 제한됩니다 (읽기 쿼터 절약 목적).');
        }
    </script>
</body>
