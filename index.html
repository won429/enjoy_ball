<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 🔥 파이어베이스 SDK (Firebase v10 Compat) 🔥 -->

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <!-- 🔥 파이어베이스 Auth(인증) SDK 추가 🔥 -->

    <style>
        @font-face {
            font-family: 'KBO-Dia-Gothic';

            font-style: normal;

            font-family: 'KBO-Dia-Gothic';

        :root { --point-color: #3182F6; }

            font-family: 'KBO-Dia-Gothic', sans-serif;

</head>
<body class="w-full min-h-[100dvh] flex justify-center items-start overflow-y-auto pb-20">

    <div id="mobile-wrapper" class="w-full h-full max-w-[500px] relative flex flex-col pt-8 px-5">
        <div class="flex items-center justify-center gap-2 mb-8 mt-4 relative">
            <i class="fa-solid fa-server text-point text-2xl"></i>
            <h1 class="text-2xl font-black text-white tracking-tight">KBO 관리자 대시보드</h1>
            <!-- 🔥 로그아웃 버튼 추가 🔥 -->
            <button onclick="logoutAdmin()" id="logout-btn" class="hidden absolute right-0 bg-[#2C2C2E] hover:bg-[#3C3C3E] text-[10px] font-bold px-2.5 py-1.5 rounded shadow active:scale-95 transition-all text-gray-300">로그아웃</button>
        </div>
        
        <div id="settings-container" class="w-full flex-1 flex flex-col gap-4"></div>

        <!-- 🔥 브라우저 차단 방지용 자체 커스텀 API 키 입력 모달 🔥 -->
        <div id="api-key-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm px-5">
            <div class="bg-[#1C1C1E] border border-white/10 rounded-3xl p-6 w-full max-w-[400px] shadow-2xl flex flex-col gap-4 transform transition-all">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-key text-point mr-2"></i>Gemini API 키 설정</h3>
                <p class="text-[12px] text-gray-400 leading-relaxed">AI 캡처 자동입력 기능을 사용하려면 Google Gemini API 키가 필요합니다.<br>최초 1회만 입력하면 기기에 안전하게 저장됩니다.</p>
                <input type="text" id="api-key-input" placeholder="여기에 API 키를 붙여넣으세요" class="bg-black/50 text-white border border-white/20 rounded-xl p-3.5 text-sm focus:outline-none focus:border-point w-full tracking-wider font-mono">
                <div class="flex gap-2 mt-2">
                    <button onclick="closeApiKeyModal()" class="flex-1 bg-[#2C2C2E] hover:bg-[#3C3C3E] text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">취소</button>
                    <button onclick="saveApiKeyAndContinue()" class="flex-1 bg-point hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">저장 및 계속</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 🔥 파이어베이스 (Firebase) 초기화 및 연결 🔥 ---
        const firebaseConfig = {
            apiKey: "AIzaSyDTGun1KsU2Cepx0oSFF7yki2uu2NT2mfk",
            authDomain: "kbo-app-98418.firebaseapp.com",
            projectId: "kbo-app-98418",
            storageBucket: "kbo-app-98418.firebasestorage.app",
            messagingSenderId: "1046094812627",
            appId: "1:1046094812627:web:2c07ec94c7e8028daa4b26"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth(); // 🔥 인증 모듈 초기화

        let scheduleData = [];
        let liveDataStore = {}; 
        let isSettingsUnlocked = false; // 🔥 보안을 위해 기본값을 false로 변경
        let pendingAiTask = null; 
        
        const initialScheduleData = []; 

        let currentDate = new Date();
        const todayStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

        function showToast(msg) {
            let toast = document.getElementById('toast-msg');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast-msg';
                toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-point text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-2xl z-[100] transition-all duration-300 opacity-0 transform -translate-y-4';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            void toast.offsetWidth; 
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => { 
                toast.classList.remove('opacity-100', 'translate-y-0'); 
                toast.classList.add('opacity-0', '-translate-y-4'); 
            }, 3500); 
        }

        // 🔥 문서 합치기(Chunking) 유틸리티 함수 (1MB 초과 방지) 🔥
        function chunkDataForFirestore(dataArray, maxSize = 800000) {
            let chunks = [];
            let currentChunk = [];
            let currentSize = 0;

            dataArray.forEach(item => {
                const itemStr = JSON.stringify(item);
                let itemSize = 0;
                for (let i = 0; i < itemStr.length; i++) {
                    const c = itemStr.charCodeAt(i);
                    itemSize += c >> 11 ? 3 : c >> 7 ? 2 : 1;
                }
                
                if (currentSize + itemSize > maxSize && currentChunk.length > 0) {
                    chunks.push(currentChunk);
                    currentChunk = [item];
                    currentSize = itemSize;
                } else {
                    currentChunk.push(item);
                    currentSize += itemSize;
                }
            });
            if (currentChunk.length > 0) chunks.push(currentChunk);
            return chunks;
        }

        // 🔥 로그인 상태 감지 리스너 🔥
        auth.onAuthStateChanged(user => {
            if (user) {
                isSettingsUnlocked = true;
                const logoutBtn = document.getElementById('logout-btn');
                if(logoutBtn) logoutBtn.classList.remove('hidden');
                syncWithFirestore(); // 로그인 성공 시에만 데이터 불러오기
            } else {
                isSettingsUnlocked = false;
                const logoutBtn = document.getElementById('logout-btn');
                if(logoutBtn) logoutBtn.classList.add('hidden');
                renderSettings(); // 로그인 전이면 로그인 화면 렌더링
            }
        });

        // 🔥 관리자 로그인 함수 🔥
        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const pwd = document.getElementById('admin-pwd').value;
            try {
                await auth.signInWithEmailAndPassword(email, pwd);
                showToast('로그인 성공! 대시보드를 불러옵니다.');
            } catch (e) {
                showToast('이메일이나 비밀번호가 일치하지 않습니다.');
            }
        }

        // 🔥 관리자 로그아웃 함수 🔥
        async function logoutAdmin() {
            try {
                await auth.signOut();
                scheduleData = [];
                liveDataStore = {};
                showToast('안전하게 로그아웃 되었습니다.');
            } catch (e) {
                showToast('로그아웃 중 오류가 발생했습니다.');
            }
        }

        async function syncWithFirestore() {
            try {
                // 🔥 1. 경기 일정 합치기 (matches_merged) 연동 🔥
                const mergedMatchesSnap = await db.collection("matches_merged").get();

                if (!mergedMatchesSnap.empty) {
                    scheduleData = [];
                    mergedMatchesSnap.forEach(doc => {
                        const chunkData = doc.data().data || [];
                        scheduleData.push(...chunkData);
                    });
                } else {
                    // 구버전(matches) 읽기
                    const oldMatchesSnap = await db.collection("matches").get();
                    if (!oldMatchesSnap.empty) {
                        scheduleData = oldMatchesSnap.docs.map(doc => doc.data());
                    }
                }

                scheduleData.sort((a, b) => {
                    if (a.date === b.date) return (a.time || "00:00").localeCompare(b.time || "00:00");
                    return a.date.localeCompare(b.date);
                });

                // 🔥 [긴급 복구] 사라진 구버전 데이터를 신버전(Merged)으로 완벽하게 자동 이관합니다 🔥
                const oldLineupsSnap = await db.collection("lineups").get();
                let baseLineupData = {};
                oldLineupsSnap.forEach(doc => {
                    baseLineupData[doc.id] = doc.data();
                });

                const mergedRef = db.collection("lineups_merged").doc("chunk_0");
                const mergedDoc = await mergedRef.get();
                let existingMerged = mergedDoc.exists ? mergedDoc.data() : {};
                
                let needsUpdate = false;
                Object.keys(baseLineupData).forEach(key => {
                    if (!existingMerged[key]) {
                        existingMerged[key] = baseLineupData[key];
                        needsUpdate = true;
                    }
                });
                
                if (needsUpdate) {
                    await mergedRef.set(existingMerged, { merge: true });
                }

                // 🔥 2. 전체 데이터는 로그인 시 딱 1번만 가볍게 읽어오기 (과거 순위 계산용) 🔥
                const mergedLineupsSnap = await db.collection("lineups_merged").get();
                liveDataStore = { ...baseLineupData }; // 구버전 데이터 기반
                
                if (!mergedLineupsSnap.empty) {
                    mergedLineupsSnap.forEach(doc => {
                        const chunkData = doc.data();
                        Object.keys(chunkData).forEach(key => {
                            liveDataStore[key] = chunkData[key]; // 신버전 덮어쓰기
                        });
                    });
                }
                
                // 🔥 3. 처음에 '선택된 날짜' 경기만 실시간 연동 시작 🔥
                let dateInput = document.getElementById('settings-date-input');
                let initialDate = dateInput ? dateInput.value : todayStr;
                listenToDateMatches(initialDate);

            } catch (error) {
                console.error("통신 에러:", error);
                showToast("데이터를 불러오지 못했습니다. 권한을 확인하세요.");
            }
        }

        // 🔥 새롭게 추가된 트래픽 최적화 1순위 함수들 🔥
        let activeLiveListeners = [];

        function listenToDateMatches(targetDate) {
            // 1. 다른 날짜의 실시간 통신 연결을 모두 끊음 (느려짐 완벽 해결)
            activeLiveListeners.forEach(unsub => unsub());
            activeLiveListeners = [];

            // 2. 선택된 날짜의 경기만 필터링
            const matchesForDate = scheduleData.filter(m => m.date === targetDate);
            
            // 3. 해당 날짜 경기들만 개별적으로 실시간 연동
            if (matchesForDate.length > 0) {
                matchesForDate.forEach(match => {
                    const unsub = db.collection("lineups").doc(match.id.toString()).onSnapshot(doc => {
                        if (doc.exists) {
                            liveDataStore[match.id] = doc.data();
                            if (isSettingsUnlocked) renderSettings();
                        }
                    });
                    activeLiveListeners.push(unsub);
                });
            } else {
                if (isSettingsUnlocked) renderSettings();
            }
        }

        function handleDateChange() {
            const dateInput = document.getElementById('settings-date-input');
            if (dateInput) {
                // 사용자가 과거/미래 날짜를 누르는 순간, 그제서야 해당 데이터를 서버에 요청!
                listenToDateMatches(dateInput.value);
            }
        }

        function renderSettings() {
            const container = document.getElementById('settings-container');
            if (!container) return;

            // 🔥 로그인 인증 화면으로 변경 🔥
            if (!isSettingsUnlocked) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-[50vh] gap-4 bg-[#111] rounded-3xl border border-white/10 p-8 shadow-2xl">
                        <i class="fa-solid fa-lock text-5xl text-gray-600 mb-2 drop-shadow-lg"></i>
                        <h2 class="text-xl font-bold text-white">관리자 로그인</h2>
                        <p class="text-[12px] text-gray-400 mb-2 text-center">대시보드에 접근하려면 관리자 계정으로 로그인하세요.</p>
                        <input type="email" id="admin-email" placeholder="관리자 이메일" class="bg-[#1C1C1E] text-white border border-white/20 rounded-xl p-3.5 text-center w-full focus:outline-none focus:border-point tracking-widest text-sm mb-2">
                        <input type="password" id="admin-pwd" placeholder="비밀번호" class="bg-[#1C1C1E] text-white border border-white/20 rounded-xl p-3.5 text-center w-full focus:outline-none focus:border-point tracking-widest font-bold text-lg mb-2">
                        <button onclick="loginAdmin()" class="bg-point hover:bg-blue-600 text-white font-bold py-3.5 px-8 rounded-xl shadow-md transition-all active:scale-95 w-full">로그인</button>
                    </div>
                `;
                return;
            }

            let dateInput = document.getElementById('settings-date-input');
            let selectedDate = dateInput ? dateInput.value : todayStr;

            let html = `
                <div class="bg-[#111] border border-white/10 rounded-3xl p-4 sm:p-5 shadow-2xl">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-base sm:text-lg font-bold text-white">경기 점수 및 이닝 관리</h2>
                        <input type="date" id="settings-date-input" value="${selectedDate}" onchange="handleDateChange()" class="bg-[#1C1C1E] text-white border border-white/20 rounded p-1 sm:p-1.5 text-xs sm:text-sm focus:outline-none focus:border-point">
                    </div>
                    <p class="text-[11px] text-gray-400 mb-5">입력 후 <span class="text-point font-bold">저장</span>을 누르면 일반 사용자의 앱에 실시간으로 반영됩니다.<br>상태를 <span class="text-white font-bold">'종료'</span>로 변경 시 <span class="text-white font-bold">전체 순위가 자동 재계산</span>됩니다.</p>
                    <div class="flex flex-col gap-3.5">
            `;

            let matches = scheduleData.filter(m => m.date === selectedDate);
            if (matches.length === 0) {
                html += `
                    <div class="bg-white/5 border border-white/5 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
                        <i class="fa-regular fa-calendar-xmark text-4xl text-gray-600 mb-3"></i>
                        <span class="text-gray-400 text-sm font-medium">해당 날짜에는 예정된 경기가 없습니다.</span>
                    </div>`;
            } else {
                matches.forEach(match => {
                    let live = liveDataStore[match.id] || { gameStatus: '경기전', awayScore: 0, homeScore: 0 };
                    
                    let inningOptionsHtml = `<option value="" class="text-black">-</option>`;
                    for (let i = 1; i <= 15; i++) {
                        inningOptionsHtml += `<option value="${i}회초" ${live.inning === i+'회초' ? 'selected' : ''} class="text-black">${i}회초</option>`;
                        inningOptionsHtml += `<option value="${i}회말" ${live.inning === i+'회말' ? 'selected' : ''} class="text-black">${i}회말</option>`;
                    }
                    
                    html += `
                        <div class="bg-[#1C1C1E] border border-white/10 rounded-2xl p-3 sm:p-4 flex flex-col relative overflow-hidden ring-1 ring-white/5">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[10px] sm:text-[11px] text-gray-400 font-medium bg-white/5 px-2 py-1 rounded-full border border-white/5 flex items-center gap-1">${match.stadium} | <input type="time" id="time-${match.id}" value="${match.time}" class="bg-transparent text-gray-300 focus:text-white outline-none w-[70px] sm:w-[75px]" style="color-scheme: dark;"></span>
                            </div>
                            
                            <div class="flex items-center justify-between gap-2 mb-3 bg-black/40 p-3 rounded-xl border border-white/5 shadow-inner">
                                <div class="flex-1 text-center font-black text-[16px] sm:text-[17px] text-gray-200 truncate">${match.team1}</div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <input type="number" id="away-score-${match.id}" value="${live.awayScore || 0}" min="0" class="w-11 sm:w-12 h-9 bg-white/10 text-white font-bold text-center text-base rounded border border-white/20 focus:border-point outline-none transition-colors">
                                    <span class="text-gray-500 font-black text-lg">:</span>
                                    <input type="number" id="home-score-${match.id}" value="${live.homeScore || 0}" min="0" class="w-11 sm:w-12 h-9 bg-white/10 text-white font-bold text-center text-base rounded border border-white/20 focus:border-point outline-none transition-colors">
                                </div>
                                <div class="flex-1 text-center font-black text-[16px] sm:text-[17px] text-gray-200 truncate">${match.team2}</div>
                            </div>
                            
                            <div class="flex flex-col gap-2 mb-3 bg-black/20 p-2.5 rounded-xl border border-white/5">
                                <!-- 🔥 추가된 링크 자동입력 영역 🔥 -->
                                <div class="flex items-center gap-1.5 mb-1 border-b border-white/5 pb-2">
                                    <input type="text" id="link-input-${match.id}" placeholder="네이버 스포츠 등 중계 링크 붙여넣기" class="flex-1 bg-black/50 text-white text-[10px] sm:text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    <button id="btn-ai-link-${match.id}" onclick="processLinkSync(${match.id}, '${match.team1}', '${match.team2}')" class="bg-teal-600/80 hover:bg-teal-500 text-white text-[10px] font-bold py-1 px-2 rounded shadow flex items-center gap-1 active:scale-95 transition-all shrink-0">
                                        <i class="fa-solid fa-rotate"></i> 링크 자동입력
                                    </button>
                                </div>
                                <div class="flex justify-end mb-0.5">
                                    <input type="file" id="file-${match.id}" accept="image/*" class="hidden" onchange="processLineupImage(event, ${match.id}, '${match.team1}', '${match.team2}')">
                                    <button id="btn-ai-${match.id}" onclick="document.getElementById('file-${match.id}').click()" class="bg-indigo-600/80 hover:bg-indigo-500 text-white text-[10px] font-bold py-1 px-2.5 rounded shadow flex items-center gap-1 active:scale-95 transition-all">
                                        <i class="fa-solid fa-camera-retro"></i> AI 캡처 자동입력
                                    </button>
                                </div>
                                <div class="flex flex-col gap-1.5">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-[42px] shrink-0 text-center leading-tight">AWAY<br>투수</span>
                                        <input type="text" id="away-pitcher-${match.id}" value="${live.awayPitcher || ''}" placeholder="${match.team1} 투수" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-[42px] shrink-0 text-center leading-tight">HOME<br>투수</span>
                                        <input type="text" id="home-pitcher-${match.id}" value="${live.homePitcher || ''}" placeholder="${match.team2} 투수" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    </div>
                                </div>
                                <div class="flex flex-col gap-1.5 mt-1 border-t border-white/5 pt-2">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-[42px] shrink-0 text-center leading-tight">AWAY<br>타자</span>
                                        <input type="text" id="away-lineup-${match.id}" value="${(live.awayLineup || []).join(', ')}" placeholder="${match.team1} 선발 라인업 (쉼표 구분)" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] font-bold text-gray-400 w-[42px] shrink-0 text-center leading-tight">HOME<br>타자</span>
                                        <input type="text" id="home-lineup-${match.id}" value="${(live.homeLineup || []).join(', ')}" placeholder="${match.team2} 선발 라인업 (쉼표 구분)" class="flex-1 bg-white/10 text-white text-[11px] rounded border border-white/20 p-1.5 focus:border-point outline-none">
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-between items-center gap-1.5 mt-1">

        // 🔥 수동 초기화 함수 🔥
        function resetApiKey() {
            localStorage.removeItem('kbo_gemini_api_key');
            showToast('기기에 저장된 API 키가 완벽하게 삭제되었습니다. 다음 캡처 시 새 키를 입력하세요!');
        }

        // 🔥 모달 제어 함수들 🔥
        function openApiKeyModal(taskType, payload, matchId, team1, team2) {
            pendingAiTask = { type: taskType, payload: payload, matchId: matchId, team1: team1, team2: team2 };
            document.getElementById('api-key-input').value = '';
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeApiKeyModal() {
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            pendingAiTask = null;
            showToast('API 키 입력이 취소되었습니다.');
        }

        function saveApiKeyAndContinue() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) {
                showToast('API 키를 입력해주세요.');
                return;
            }
            localStorage.setItem('kbo_gemini_api_key', key);
            
            const modal = document.getElementById('api-key-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            
            if (pendingAiTask) {
                if (pendingAiTask.type === 'image') {
                    executeAiProcess(pendingAiTask.payload, pendingAiTask.matchId, pendingAiTask.team1, pendingAiTask.team2, key);
                } else if (pendingAiTask.type === 'link') {
                    executeLinkSyncProcess(pendingAiTask.payload, pendingAiTask.matchId, pendingAiTask.team1, pendingAiTask.team2, key);
                }
                pendingAiTask = null;
            }
        }

        // 사진 올릴 때 가장 먼저 실행되는 함수
        async function processLineupImage(event, matchId, team1, team2) {
            const file = event.target.files[0];
            if (!file) return;

            let apiKey = localStorage.getItem('kbo_gemini_api_key');
            
            if (!apiKey) {
                openApiKeyModal('image', file, matchId, team1, team2);
                event.target.value = ''; 
                return;
            }
            
            executeAiProcess(file, matchId, team1, team2, apiKey);
            event.target.value = ''; 
        }

        // 🔥 링크 동기화 버튼 클릭 시 실행되는 함수 🔥
        async function processLinkSync(matchId, team1, team2) {
            const urlInput = document.getElementById(`link-input-${matchId}`).value.trim();
            if (!urlInput) {
                showToast('네이버 스포츠 등 중계 링크를 입력해주세요.');
                return;
            }

            let apiKey = localStorage.getItem('kbo_gemini_api_key');
            if (!apiKey) {
                openApiKeyModal('link', urlInput, matchId, team1, team2);
                return;
            }

            executeLinkSyncProcess(urlInput, matchId, team1, team2, apiKey);
        }

        // 🔥 링크 크롤링 및 실시간 AI 데이터 추출 로직 🔥
        async function executeLinkSyncProcess(urlStr, matchId, team1, team2, apiKey) {
            const btn = document.getElementById(`btn-ai-link-${matchId}`);
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 추출중...`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            showToast('웹페이지에서 실시간 데이터를 읽고 있습니다... 📡');

            try {
                // 브라우저 보안(CORS) 우회를 위해 무료 프록시 서버 사용
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlStr)}`;
                const proxyRes = await fetch(proxyUrl);
                const proxyData = await proxyRes.json();
                
                if (!proxyData.contents) {
                    throw new Error("웹페이지를 읽어올 수 없습니다. 유효한 중계 링크인지 확인해주세요.");
                }

                // 🔥 네이버 스포츠의 숨겨진 데이터(Script)까지 완벽하게 긁어오도록 로직 대폭 수정 🔥
                const parser = new DOMParser();
                const doc = parser.parseFromString(proxyData.contents, 'text/html');
                // script 태그를 삭제하지 않고 살려둡니다. 실시간 점수와 라인업 데이터가 그 안에 숨어있기 때문입니다!
                doc.querySelectorAll('style, img, svg, iframe, noscript').forEach(el => el.remove());
                
                // body.innerText 대신 문서 전체의 텍스트(스크립트 데이터 포함)를 넓게 가져옴 (최대 6만자 상향)
                const textContent = doc.documentElement.textContent.replace(/\s+/g, ' ').trim().substring(0, 60000); 

                if (textContent.length < 50) {
                    throw new Error("링크 보안 차단으로 내용을 읽을 수 없습니다. 다른 중계 링크를 시도해주세요.");
                }

                const promptText = `다음은 KBO 야구 중계 페이지의 추출된 텍스트야. 여기서 ${team1}과(와) ${team2}의 실시간 경기 정보를 정확히 추출해줘.
텍스트 데이터:
${textContent}

반드시 아래 JSON 구조로만 반환해 (마크다운 백틱은 사용 금지, 오직 JSON만 반환).
아직 정보가 없다면 기본값이나 빈 문자열을 넣어줘.
{
  "gameStatus": "경기전, 경기중, 종료, 우취 중 하나",
  "inning": "진행 중인 이닝 (예: 3회초, 5회말. 경기전/종료면 빈문자열)",
  "awayScore": ${team1}의 현재 점수 (숫자만, 없으면 0),
  "homeScore": ${team2}의 현재 점수 (숫자만, 없으면 0),
  "awayPitcher": "${team1} 선발투수 이름",
  "homePitcher": "${team2} 선발투수 이름",
  "awayLineup": "${team1} 선발타자 1번~9번 이름 (쉼표로 구분)",
  "homeLineup": "${team2} 선발타자 1번~9번 이름 (쉼표로 구분)"
}`;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
                };

                // 🔥 에러를 일으키는 구형 모델(gemini-pro) 제거, 최신 호환 모델만 유지 🔥
                const fallbackModels = [
                    "gemini-1.5-flash-latest",
                    "gemini-1.5-flash",
                    "gemini-2.5-flash"
                ];

                let result = null;
                let lastErrorMessage = "";

                for (const model of fallbackModels) {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    
                    const fetchWithBackoff = async () => {
                        const delays = [1000, 2000, 4000]; 
                        for (let i = 0; i < 3; i++) {
                            try {
                                const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                if (res.ok) return await res.json();
                                
                                const errText = await res.text();
                                // 🔥 400 에러일 때 키를 삭제하지 않고 다음 모델로 안전하게 넘어가도록 완벽 수정 🔥
                                if (res.status === 401 || res.status === 403) {
                                    localStorage.removeItem('kbo_gemini_api_key');
                                    throw new Error(`API 키 오류 또는 권한 없음`);
                                } else if (res.status === 404 || res.status === 400) {
                                    throw new Error("MODEL_NOT_FOUND");
                                } else if (res.status === 429) {
                                    throw new Error("구글 API 무료 할당량 초과");
                                }
                                throw new Error(`구글 서버 오류`);
                            } catch (err) {
                                if (err.name === "TypeError" && err.message.includes("fetch")) throw new Error("통신 차단됨 (광고차단기 등을 꺼주세요)");
                                if (err.message.includes("API 키") || err.message.includes("할당량") || err.message === "MODEL_NOT_FOUND") throw err;
                                if (i === 2) throw err;
                            }
                            await new Promise(r => setTimeout(r, delays[i]));
                        }
                    };

                    try {
                        result = await fetchWithBackoff();
                        break;
                    } catch (err) {
                        if (err.message === "MODEL_NOT_FOUND") {
                            lastErrorMessage = "사용 가능한 모델 버전을 찾을 수 없습니다.";
                            continue;
                        } else {
                            throw err;
                        }
                    }
                }

                if (!result) throw new Error(lastErrorMessage || "AI 통신에 실패했습니다.");

                let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(text);
                    
                    if (data.gameStatus) document.getElementById(`status-${matchId}`).value = data.gameStatus;
                    if (data.inning !== undefined) document.getElementById(`inning-${matchId}`).value = data.inning;
                    if (data.awayScore !== undefined) document.getElementById(`away-score-${matchId}`).value = data.awayScore;
                    if (data.homeScore !== undefined) document.getElementById(`home-score-${matchId}`).value = data.homeScore;
                    
                    if (data.awayPitcher) document.getElementById(`away-pitcher-${matchId}`).value = data.awayPitcher;
                    if (data.homePitcher) document.getElementById(`home-pitcher-${matchId}`).value = data.homePitcher;
                    if (data.awayLineup) document.getElementById(`away-lineup-${matchId}`).value = data.awayLineup;
                    if (data.homeLineup) document.getElementById(`home-lineup-${matchId}`).value = data.homeLineup;
                    
                    showToast('✅ 데이터 동기화 완료! 확인 후 [서버 저장]을 누르세요.');
                } else {
                    throw new Error("웹페이지에서 데이터를 찾지 못했습니다.");
                }
            } catch (e) {
                console.error("Link Sync Error:", e);
                showToast(`오류 발생: ${e.message}`);
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // 실질적인 AI 통신 처리 함수
        async function executeAiProcess(file, matchId, team1, team2, apiKey) {
            const btn = document.getElementById(`btn-ai-${matchId}`);
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 분석 진행중...`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            showToast('AI가 라인업 이미지를 분석 중입니다... ⚾️');

            const reader = new FileReader();
            reader.onloadend = async () => {
                try {
                    const base64String = reader.result.split(',')[1];
                    const mimeType = file.type;
                    
                    const promptText = `이 KBO 야구 라인업 이미지에서 AWAY팀(${team1})과 HOME팀(${team2})의 선발투수와 선발타자 1~9번 라인업을 추출해줘.
반드시 아래 JSON 구조로만 반환해 (마크다운 백틱은 사용 금지, 오직 JSON만 반환):
{
  "awayPitcher": "${team1} 투수 이름",
  "homePitcher": "${team2} 투수 이름",
  "awayLineup": "${team1} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9",
  "homeLineup": "${team2} 타자1, 타자2, 타자3, 타자4, 타자5, 타자6, 타자7, 타자8, 타자9"
}`;

                    const payload = {
                        contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: mimeType, data: base64String } }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    // 🔥 에러를 일으키는 구형 모델 제거 및 안정화 🔥
                    const fallbackModels = [
                        "gemini-1.5-flash-latest",
                        "gemini-1.5-flash",
                        "gemini-2.5-flash"
                    ];

                    let result = null;
                    let lastErrorMessage = "";

                    for (const model of fallbackModels) {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                        console.log(`[AI] 시도 중인 모델 엔진: ${model}`);

                        const fetchWithBackoff = async () => {
                            const delays = [1000, 2000, 4000]; 
                            for (let i = 0; i < 3; i++) {
                                try {
                                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                    if (res.ok) {
                                        return await res.json();
                                    } else {
                                        const errText = await res.text();
                                        console.error(`API 오류 (상태코드: ${res.status}):`, errText);
                                        
                                        // 🔥 400 에러 처리 완벽 수정: 키 삭제 방지 🔥
                                        if (res.status === 401 || res.status === 403) {
                                            localStorage.removeItem('kbo_gemini_api_key');
                                            throw new Error(`API 키가 잘못되었거나 권한이 없습니다.`);
                                        } else if (res.status === 404 || res.status === 400) {
                                            throw new Error("MODEL_NOT_FOUND"); 
                                        } else if (res.status === 429) {
                                            throw new Error("구글 API 무료 할당량 초과");
                                        }
                                        throw new Error(`구글 서버 오류 (코드: ${res.status})`);
                                    }
                                } catch (err) {
                                    if (err.name === "TypeError" && err.message.includes("fetch")) {
                                        throw new Error("브라우저 통신 차단 (광고차단기를 끄거나 다른 브라우저를 사용하세요)");
                                    }
                                    if (err.message.includes("API 키가 잘못") || err.message.includes("할당량") || err.message === "MODEL_NOT_FOUND") throw err;
                                    if (i === 2) throw err;
                                }
                                await new Promise(r => setTimeout(r, delays[i]));
                            }
                        };

                        try {
                            result = await fetchWithBackoff();
                            break; 
                        } catch (err) {
                            if (err.message === "MODEL_NOT_FOUND") {
                                console.warn(`[AI] ${model} 버전을 지원하지 않아 다음 버전으로 넘어갑니다.`);
                                lastErrorMessage = "사용 가능한 모델 버전을 찾을 수 없습니다.";
                                continue; 
                            } else {
                                throw err; 
                            }
                        }
                    }

                    if (!result) {
                        throw new Error(lastErrorMessage || "모든 모델 버전 시도에 실패했습니다.");
                    }

                    let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if(text) {

        async function saveMatchData(matchId) {
            const status = document.getElementById(`status-${matchId}`).value;
            const inning = document.getElementById(`inning-${matchId}`).value;
            const awayScore = parseInt(document.getElementById(`away-score-${matchId}`).value) || 0;
            const homeScore = parseInt(document.getElementById(`home-score-${matchId}`).value) || 0;

            const awayPitcher = document.getElementById(`away-pitcher-${matchId}`).value.trim();
            const homePitcher = document.getElementById(`home-pitcher-${matchId}`).value.trim();
            const awayLineupStr = document.getElementById(`away-lineup-${matchId}`).value;
            const homeLineupStr = document.getElementById(`home-lineup-${matchId}`).value;
            
            const newTime = document.getElementById(`time-${matchId}`).value; // 🔥 시간 값 가져오기

            const awayLineup = awayLineupStr ? awayLineupStr.split(',').map(s => s.trim()).filter(s => s !== '') : [];
            const homeLineup = homeLineupStr ? homeLineupStr.split(',').map(s => s.trim()).filter(s => s !== '') : [];

            try {
                // 🔥 경기 시간 변경 감지 및 일정(scheduleData) 업데이트 🔥
                let timeChanged = false;
                const matchIndex = scheduleData.findIndex(m => m.id === matchId);
                if (matchIndex !== -1 && scheduleData[matchIndex].time !== newTime) {
                    scheduleData[matchIndex].time = newTime;
                    timeChanged = true;
                }

                const matchData = {
                    gameStatus: status,
                    inning: inning,
                    awayScore: awayScore,
                    homeScore: homeScore,
                    awayPitcher: awayPitcher,
                    homePitcher: homePitcher,
                    awayLineup: awayLineup,
                    homeLineup: homeLineup
                };

                // 🔥 데이터 유실을 100% 방지하기 위해 구버전(lineups)에도 똑같이 안전하게 저장해둡니다 🔥
                await db.collection("lineups").doc(matchId.toString()).set(matchData, { merge: true });

                // 🔥 lineups_merged 의 청크(chunk_0)로 데이터 통합 저장 🔥
                await db.collection("lineups_merged").doc("chunk_0").set({
                    [matchId.toString()]: matchData
                }, { merge: true });

                // 🔥 시간이 변경되었다면 matches_merged(일정 데이터)도 함께 업데이트 🔥
                if (timeChanged) {
                    const chunks = chunkDataForFirestore(scheduleData);
                    const batch = db.batch();
                    chunks.forEach((chunk, index) => {
                        batch.set(db.collection("matches_merged").doc(`chunk_${index}`), { data: chunk });
                    });
                    await batch.commit();
                }

                showToast('성공적으로 서버에 저장되었습니다.');

                if (status === '종료') {
                    await recalculateRankings();
                }
            } catch(e) {
                console.error("데이터 저장 에러:", e);
                showToast('저장 중 통신 오류가 발생했습니다.');
            }
        }

        async function recalculateRankings() {
            showToast('전체 순위를 재계산 중입니다...');
            let teamStats = {};
            const allTeams = ['KIA', '삼성', 'LG', '두산', 'KT', 'SSG', '롯데', '한화', 'NC', '키움'];
            
            allTeams.forEach(t => { teamStats[t] = { team: t, w: 0, d: 0, l: 0, winRate: 0, gb: 0 }; });

            scheduleData.forEach(match => {
                const live = liveDataStore[match.id];
                if (live && live.gameStatus === '종료') {
                    const awayTeam = match.team1;
                    const homeTeam = match.team2;
                    const awayScore = parseInt(live.awayScore) || 0;
                    const homeScore = parseInt(live.homeScore) || 0;

                    if (awayScore > homeScore) {
                        if (teamStats[awayTeam]) teamStats[awayTeam].w++;
                        if (teamStats[homeTeam]) teamStats[homeTeam].l++;
                    } else if (homeScore > awayScore) {
                        if (teamStats[homeTeam]) teamStats[homeTeam].w++;
                        if (teamStats[awayTeam]) teamStats[awayTeam].l++;
                    } else {
                        if (teamStats[awayTeam]) teamStats[awayTeam].d++;
                        if (teamStats[homeTeam]) teamStats[homeTeam].d++;
                    }
                }
            });

            let statsArray = Object.values(teamStats);
            statsArray.forEach(t => {
                const total = t.w + t.l;
                t.winRate = total === 0 ? '-' : (t.w / total).toFixed(3);
                t._calcWinRate = total === 0 ? -1 : (t.w / total);
            });

            statsArray.sort((a, b) => {
                if (b._calcWinRate !== a._calcWinRate) return b._calcWinRate - a._calcWinRate;
                if (b.w !== a.w) return b.w - a.w;
                return 0; 
            });

            if (statsArray.length > 0) {
                const firstTeam = statsArray[0];
                statsArray.forEach((t, i) => {
                    if (i === 0 || firstTeam._calcWinRate === -1) {
                        t.gb = '-';
                    } else {
                        const gb = ((firstTeam.w - t.w) + (t.l - firstTeam.l)) / 2;
                        t.gb = gb === 0 ? '-' : gb.toString();
                    }

                    if (i > 0) {
                        const prev = statsArray[i-1];
                        if (t._calcWinRate === prev._calcWinRate && t.w === prev.w) {
                            t.rank = prev.rank;
                        } else {
                            t.rank = (i + 1).toString();
                        }
                    } else {
                        t.rank = t._calcWinRate === -1 ? '-' : '1';
                    }
                });
            }

            try {
                // 🔥 rankings_merged 로 순위 데이터 청크 분할 및 통합 저장 🔥
                const chunks = chunkDataForFirestore(statsArray);
                const batch = db.batch();
                chunks.forEach((chunk, index) => {
                    batch.set(db.collection("rankings_merged").doc(`chunk_${index}`), { data: chunk });
                });
                await batch.commit();
                showToast('서버 순위가 완벽하게 동기화되었습니다!');
            } catch(error) {
                console.error("순위 업데이트 실패:", error);
                showToast('순위 반영 중 오류가 발생했습니다.');
            }
        }

        async function forceUploadSchedule() {
            showToast('일정 데이터를 서버로 강제 업로드 중입니다...');
            try {
                // 🔥 matches_merged 로 일정 데이터 청크 분할 및 통합 업로드 🔥
                const chunks = chunkDataForFirestore(initialScheduleData);
                const batch = db.batch();
                chunks.forEach((chunk, index) => {
                    batch.set(db.collection("matches_merged").doc(`chunk_${index}`), { data: chunk });
                });
                await batch.commit();
                
                showToast('모든 일정이 서버에 등록되었습니다!');
                syncWithFirestore();
            } catch (e) {
                console.error("일정 업로드 에러:", e);
                showToast('업로드 중 오류가 발생했습니다.');
            }
        }

        async function backupData() {
            showToast('데이터 백업 중...');
            try {
                // 🔥 통합된(merged) 컬렉션을 백업 🔥
                const lineupsSnap = await db.collection("lineups_merged").get();
                const rankingsSnap = await db.collection("rankings_merged").get();
                const batch = db.batch();

                lineupsSnap.forEach(doc => { batch.set(db.collection("backup_lineups_merged").doc(doc.id), doc.data()); });
                rankingsSnap.forEach(doc => { batch.set(db.collection("backup_rankings_merged").doc(doc.id), doc.data()); });

                await batch.commit();
                showToast('백업이 완료되었습니다.');
            } catch (e) {
                console.error("백업 에러:", e);
                showToast('백업 중 오류가 발생했습니다.');
            }
        }

        async function restoreData() {
            showToast('데이터 복구 중...');
            try {
                // 🔥 통합된(merged) 백업 컬렉션에서 복구 🔥
                const bLineupsSnap = await db.collection("backup_lineups_merged").get();
                const bRankingsSnap = await db.collection("backup_rankings_merged").get();

                if (bLineupsSnap.empty && bRankingsSnap.empty) {
                    showToast('복구할 백업 데이터가 없습니다.');
                    return;
                }

                const batch = db.batch();

                bLineupsSnap.forEach(doc => { batch.set(db.collection("lineups_merged").doc(doc.id), doc.data()); });
                bRankingsSnap.forEach(doc => { batch.set(db.collection("rankings_merged").doc(doc.id), doc.data()); });

                await batch.commit();
                showToast('데이터가 백업 시점으로 복구되었습니다.');
            } catch (e) {
                console.error("복구 에러:", e);
                showToast('복구 중 오류가 발생했습니다.');
            }
        }
    </script>
